<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Parsanol Performance Architecture</text>

  <!-- Input -->
  <rect x="50" y="80" width="120" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Input String</text>
  <text x="110" y="128" text-anchor="middle" font-size="10" fill="#3b82f6">"hello world"</text>

  <!-- Arrow to Backend Selection -->
  <path d="M170 110 L220 110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backend Selection Box -->
  <rect x="220" y="60" width="180" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Backend Selection</text>

  <!-- Packrat Option -->
  <rect x="230" y="100" width="75" height="30" rx="4" fill="#bbf7d0"/>
  <text x="267" y="120" text-anchor="middle" font-size="9" font-weight="500" fill="#166534">Packrat</text>

  <!-- Bytecode VM Option -->
  <rect x="315" y="100" width="75" height="30" rx="4" fill="#86efac"/>
  <text x="352" y="120" text-anchor="middle" font-size="9" font-weight="500" fill="#166534">Bytecode</text>

  <!-- Streaming Option -->
  <rect x="230" y="140" width="160" height="25" rx="4" fill="#fef3c7"/>
  <text x="310" y="157" text-anchor="middle" font-size="9" fill="#92400e">Streaming (for large files)</text>

  <!-- Arrow from Backend to Processing -->
  <path d="M400 110 L450 110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Processing Box -->
  <rect x="450" y="60" width="160" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Processing</text>

  <!-- Processing sub-components -->
  <rect x="460" y="100" width="65" height="25" rx="4" fill="#fde68a"/>
  <text x="492" y="117" text-anchor="middle" font-size="9" fill="#92400e">Memoize</text>

  <rect x="535" y="100" width="65" height="25" rx="4" fill="#fde68a"/>
  <text x="567" y="117" text-anchor="middle" font-size="9" fill="#92400e">SIMD</text>

  <rect x="460" y="130" width="140" height="25" rx="4" fill="#fef08a"/>
  <text x="530" y="147" text-anchor="middle" font-size="9" fill="#92400e">Zero-Copy References</text>

  <!-- Arrow to Arena -->
  <path d="M610 110 L660 110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arena Allocator -->
  <rect x="660" y="60" width="140" height="120" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="730" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Arena Allocator</text>

  <!-- Arena sub-components -->
  <rect x="670" y="100" width="55" height="25" rx="4" fill="#e9d5ff"/>
  <text x="697" y="117" text-anchor="middle" font-size="9" fill="#7e22ce">AST</text>

  <rect x="735" y="100" width="55" height="25" rx="4" fill="#e9d5ff"/>
  <text x="762" y="117" text-anchor="middle" font-size="9" fill="#7e22ce">Strings</text>

  <rect x="670" y="130" width="120" height="25" rx="4" fill="#f3e8ff"/>
  <text x="730" y="147" text-anchor="middle" font-size="9" fill="#7e22ce">Single Allocation</text>

  <!-- Arrow to Output -->
  <path d="M800 110 L830 110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="830" y="80" width="60" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="860" y="115" text-anchor="middle" font-size="11" font-weight="500" fill="#047857">Result</text>

  <!-- Performance Features Section -->
  <text x="50" y="210" font-size="14" font-weight="600" fill="#1e293b">Backend Options</text>

  <!-- Packrat Backend -->
  <rect x="50" y="230" width="200" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="150" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Packrat Backend</text>

  <text x="60" y="275" font-size="9" fill="#475569">• O(n) time guaranteed</text>
  <text x="60" y="292" font-size="9" fill="#475569">• Memoizes all parse results</text>
  <text x="60" y="309" font-size="9" fill="#475569">• Best for complex grammars</text>
  <text x="60" y="326" font-size="9" fill="#475569">• Predictable memory: O(n × r)</text>

  <rect x="60" y="340" width="180" height="18" rx="4" fill="#bfdbfe"/>
  <text x="150" y="353" text-anchor="middle" font-size="8" fill="#1e40af">Recommended for captures &amp; dynamic</text>

  <!-- Bytecode VM Backend -->
  <rect x="270" y="230" width="200" height="130" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="370" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Bytecode VM Backend</text>

  <text x="280" y="275" font-size="9" fill="#475569">• Stack-based execution</text>
  <text x="280" y="292" font-size="9" fill="#475569">• O(d) memory (depth only)</text>
  <text x="280" y="309" font-size="9" fill="#475569">• 10-32x faster for expressions</text>
  <text x="280" y="326" font-size="9" fill="#475569">• Requires pre-compilation</text>

  <rect x="280" y="340" width="180" height="18" rx="4" fill="#a7f3d0"/>
  <text x="370" y="353" text-anchor="middle" font-size="8" fill="#047857">Best for simple patterns &amp; memory-limited</text>

  <!-- Streaming Parser -->
  <rect x="490" y="230" width="200" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="590" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Streaming Parser</text>

  <text x="500" y="275" font-size="9" fill="#475569">• Fixed chunk size (e.g., 1MB)</text>
  <text x="500" y="292" font-size="9" fill="#475569">• Bounded memory regardless of file</text>
  <text x="500" y="309" font-size="9" fill="#475569">• Works with captures &amp; scopes</text>
  <text x="500" y="326" font-size="9" fill="#475569">• Parse GB files in MB RAM</text>

  <rect x="500" y="340" width="180" height="18" rx="4" fill="#fef08a"/>
  <text x="590" y="353" text-anchor="middle" font-size="8" fill="#92400e">For large files: logs, CSV, JSON streams</text>

  <!-- SmallVec -->
  <rect x="710" y="230" width="140" height="130" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1"/>
  <text x="780" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">SmallVec</text>

  <text x="720" y="275" font-size="9" fill="#475569">• Stack for small arrays</text>
  <text x="720" y="292" font-size="9" fill="#475569">• Heap only when needed</text>
  <text x="720" y="309" font-size="9" fill="#475569">• Cache-friendly access</text>
  <text x="720" y="326" font-size="9" fill="#475569">• No pointer chasing</text>

  <rect x="720" y="340" width="120" height="18" rx="4" fill="#fbcfe8"/>
  <text x="780" y="353" text-anchor="middle" font-size="8" fill="#9d174d">Stack-allocated small arrays</text>

  <!-- Benchmark Results -->
  <text x="50" y="400" font-size="14" font-weight="600" fill="#1e293b">Key Benchmarks</text>

  <!-- Chart background -->
  <rect x="50" y="415" width="800" height="100" rx="8" fill="#f1f5f9"/>

  <!-- Bar 1: O(n) Guaranteed -->
  <rect x="80" y="430" width="200" height="30" rx="4" fill="url(#gradient1)"/>
  <text x="180" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="white">O(n) Guaranteed</text>
  <text x="80" y="470" font-size="9" fill="#64748b">Predictable Performance</text>

  <!-- Bar 2: Bounded Memory -->
  <rect x="300" y="430" width="240" height="30" rx="4" fill="url(#gradient2)"/>
  <text x="420" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="white">Bounded Memory (Streaming)</text>
  <text x="300" y="470" font-size="9" fill="#64748b">Parse 10GB in 2MB RAM</text>

  <!-- Bar 3: 99.5% fewer allocations -->
  <rect x="560" y="430" width="270" height="30" rx="4" fill="url(#gradient3)"/>
  <text x="695" y="450" text-anchor="middle" font-size="11" font-weight="600" fill="white">99.5% Fewer Allocations</text>
  <text x="560" y="470" font-size="9" fill="#64748b">Arena-based allocation</text>

  <!-- When to use each backend -->
  <text x="50" y="510" font-size="12" font-weight="600" fill="#1e293b">When to Use Each Backend:</text>
  <text x="50" y="530" font-size="10" fill="#475569">• <tspan font-weight="600" fill="#1e40af">Packrat</tspan>: Captures, dynamic atoms, complex grammars — predictable O(n)</text>
  <text x="50" y="548" font-size="10" fill="#475569">• <tspan font-weight="600" fill="#047857">Bytecode VM</tspan>: Simple patterns, expressions, memory-constrained environments</text>
  <text x="50" y="566" font-size="10" fill="#475569">• <tspan font-weight="600" fill="#92400e">Streaming</tspan>: Large files (logs, CSV, JSON) that don't fit in memory</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
</svg>
