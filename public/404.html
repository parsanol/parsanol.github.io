<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Parsanol</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      .card { max-width: 36rem; text-align: center; padding: 3rem 1.5rem; }
      .logo { height: 2.5rem; width: auto; margin-bottom: 1.5rem; }
      h1 { font-size: 2.5rem; font-weight: 700; margin: 0 0 0.75rem; letter-spacing: -0.02em; }
      .code { color: #3d5bab; }
      p { color: #4b5563; line-height: 1.6; margin: 0 0 2rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s;
      }
      a.primary { background: #3d5bab; color: #fff; }
      a.primary:hover { background: #2f4789; }
      a.secondary { background: #e5e7eb; color: #111827; }
      a.secondary:hover { background: #d1d5db; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f3f4f6; }
        p { color: #9ca3af; }
        a.secondary { background: #374151; color: #f3f4f6; }
        a.secondary:hover { background: #4b5563; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logo.svg" alt="Parsanol" />
      <h1><span class="code">404</span> — Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <nav class="links">
        <a class="btn primary" href="/">Home</a>
        <a class="btn secondary" href="/parg">PARG</a>
        <a class="btn secondary" href="/introduction">Introduction</a>
        <a class="btn secondary" href="/playground">Playground</a>
      </nav>
    </main>
  </body>
</html>
